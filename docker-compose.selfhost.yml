# Stratify — single-file self-hosted deployment.
#
#   cp .env.selfhost.example .env.selfhost   # then edit (or run ./stratify.sh setup)
#   docker compose -f docker-compose.selfhost.yml --env-file .env.selfhost up -d --build
#
# Everything is built from this repository, so your changes (branding, features) ship as-is.
# Open http://<APP_DOMAIN> when the stack is healthy; the instance admin lives at /god-mode.

name: stratify

x-db-env: &db-env
  PGHOST: stratify-db
  PGDATABASE: ${POSTGRES_DB:-stratify}
  POSTGRES_USER: ${POSTGRES_USER:-stratify}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.selfhost}
  POSTGRES_DB: ${POSTGRES_DB:-stratify}
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: stratify-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://stratify-redis:6379/

x-storage-env: &storage-env
  USE_MINIO: ${USE_MINIO:-1}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:-stratify}
  AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?Set STORAGE_SECRET_KEY in .env.selfhost}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}

x-mail-env: &mail-env
  # Instance-wide default mail server. Each workspace can override it in
  # Settings -> Mail server, and God mode -> Email can change it at runtime.
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
  EMAIL_FROM: ${EMAIL_FROM:-Stratify <no-reply@stratify.local>}

x-app-env: &app-env
  BRAND_NAME: ${BRAND_NAME:-Stratify}
  WEB_URL: ${WEB_URL:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${WEB_URL:-http://localhost}
  DEBUG: 0
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  DATABASE_URL: postgresql://${POSTGRES_USER:-stratify}:${POSTGRES_PASSWORD}@stratify-db:5432/${POSTGRES_DB:-stratify}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.selfhost}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?Set LIVE_SERVER_SECRET_KEY in .env.selfhost}
  AMQP_URL: amqp://${RABBITMQ_USER:-stratify}:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.selfhost}@stratify-mq:5672/${RABBITMQ_VHOST:-stratify}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  NUM_PROXIES: ${NUM_PROXIES:-}
  HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS:-60}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  # Stratify is self-hosted first: no telemetry is pushed unless you opt in.
  METRICS_PUSH_INTERVAL_MINUTES: ${METRICS_PUSH_INTERVAL_MINUTES:-10000000}

x-backend: &backend
  image: stratify/backend:${STRATIFY_VERSION:-local}
  build:
    context: ./apps/api
    dockerfile: Dockerfile.api
  restart: unless-stopped
  environment:
    <<: [*app-env, *db-env, *redis-env, *storage-env, *mail-env]
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # ------------------------------------------------------------------ frontends
  web:
    image: stratify/web:${STRATIFY_VERSION:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile.web
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api

  admin:
    image: stratify/admin:${STRATIFY_VERSION:-local}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.admin
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api

  space:
    image: stratify/space:${STRATIFY_VERSION:-local}
    build:
      context: .
      dockerfile: apps/space/Dockerfile.space
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api

  live:
    image: stratify/live:${STRATIFY_VERSION:-local}
    build:
      context: .
      dockerfile: apps/live/Dockerfile.live
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    environment:
      <<: *redis-env
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
    depends_on:
      - api

  # ------------------------------------------------------------------ backend
  migrator:
    <<: *backend
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    depends_on:
      stratify-db:
        condition: service_healthy
      stratify-redis:
        condition: service_started

  api:
    <<: *backend
    command: ./bin/docker-entrypoint-api.sh
    volumes:
      - logs_api:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      stratify-mq:
        condition: service_started

  worker:
    <<: *backend
    command: ./bin/docker-entrypoint-worker.sh
    volumes:
      - logs_worker:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      stratify-mq:
        condition: service_started

  beat-worker:
    <<: *backend
    command: ./bin/docker-entrypoint-beat.sh
    volumes:
      - logs_beat:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      stratify-mq:
        condition: service_started

  # ------------------------------------------------------------------ data services
  stratify-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=500'
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stratify} -d ${POSTGRES_DB:-stratify}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  stratify-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    logging: *logging

  stratify-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-stratify}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-stratify}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    logging: *logging

  # Object storage (S3 compatible). The proxy expects this service name.
  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-stratify}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    volumes:
      - uploads:/export
    logging: *logging

  # ------------------------------------------------------------------ edge
  proxy:
    image: stratify/proxy:${STRATIFY_VERSION:-local}
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CERT_EMAIL: ${CERT_EMAIL:-}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    logging: *logging
    depends_on:
      - web
      - admin
      - space
      - live
      - api

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
  proxy_config:
  proxy_data:
  logs_api:
  logs_worker:
  logs_beat:
